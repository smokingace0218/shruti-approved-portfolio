<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // GitHub Pages serves this project below /portfolio/. Convert its
      // query-based fallback back to the intended route before the app boots.
      const portfolioBase = location.hostname.endsWith('.github.io') && (location.pathname === '/portfolio' || location.pathname.startsWith('/portfolio/')) ? '/portfolio' : '';
      window.__PORTFOLIO_BASE__ = portfolioBase;
      const requestedRoute = new URLSearchParams(location.search).get('route');
      if (requestedRoute) {
        const cleanRoute = requestedRoute.startsWith('/') && !requestedRoute.startsWith('//') ? requestedRoute : '/';
        const destination = new URLSearchParams(new URLSearchParams(location.search).get('destinationSearch') || '');
        destination.delete('route');
        destination.delete('destinationSearch');
        const query = destination.toString();
        history.replaceState(history.state, '', `${portfolioBase}${cleanRoute}${query ? '?' + query : ''}${location.hash}`);
      }
      // A new visit opens the storybook first. Once its final page hands off,
      // keep the portfolio landing available for the rest of this tab session.
      try {
        if (!portfolioBase && location.pathname === '/' && !requestedRoute && !new URLSearchParams(location.search).has('from') && sessionStorage.getItem('storybook-preview-seen') !== '1') {
          location.replace('/sketchbook/');
        }
      } catch (_) {}
    </script>
    <script>
      if (location.pathname.replace(/\/$/, '') === '/portfolio') {
        const pose = document.createElement('link');
        pose.rel = 'preload'; pose.as = 'image'; pose.fetchPriority = 'high';
        pose.href = '/assets/optimized/janitri-concepts/shruti-idea-snap-open.webp';
        document.head.append(pose);
      }
    </script>
    <meta name="theme-color" content="#f5f1e9" />
    <meta name="description" content="Come along with Shruti as she notices, makes, questions and designs." />

      `);
